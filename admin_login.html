<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login - Smart AI Exam Integrity</title>
  
  <!-- ฟอนต์ Inter และ Sarabun จาก Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       1. ตัวแปรสีและธีม (CSS Custom Properties & Color Tokens)
       ========================================================================== */
    :root {
      /* โหมดสว่าง (Light Mode - ค่าเริ่มต้น) */
      --bg-page: #F8FAFC;
      --bg-card: #FFFFFF;
      --bg-input: #FFFFFF;
      --bg-input-focus: #FFFFFF;

      --text-title: #0F172A;
      --text-body: #334155;
      --text-muted: #64748B;
      --text-placeholder: #94A3B8;

      --border-subtle: #E2E8F0;
      --border-strong: #CBD5E1;
      --border-focus: #2563EB;

      --primary: #2563EB;
      --primary-hover: #1D4ED8;
      --primary-active: #1E40AF;
      --primary-focus-ring: rgba(37, 99, 235, 0.2);

      --danger: #EF4444;
      --danger-bg: #FEF2F2;
      --danger-border: #FCA5A5;

      --success: #10B981;
      --success-bg: #ECFDF5;
      --success-border: #6EE7B7;

      --shadow-card: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
      --shadow-btn: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    /* โหมดมืดอัตโนมัติตามการตั้งค่าของเครื่อง (Automatic Dark Mode via OS Preference) */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-page: #0B0F19;
        --bg-card: #111827;
        --bg-input: #1E293B;
        --bg-input-focus: #0F172A;

        --text-title: #F8FAFC;
        --text-body: #E2E8F0;
        --text-muted: #94A3B8;
        --text-placeholder: #64748B;

        --border-subtle: #1F2937;
        --border-strong: #374151;
        --border-focus: #3B82F6;

        --primary: #3B82F6;
        --primary-hover: #2563EB;
        --primary-active: #1D4ED8;
        --primary-focus-ring: rgba(59, 130, 246, 0.3);

        --danger: #F87171;
        --danger-bg: rgba(239, 68, 68, 0.12);
        --danger-border: rgba(239, 68, 68, 0.3);

        --success: #34D399;
        --success-bg: rgba(16, 185, 129, 0.12);
        --success-border: rgba(16, 185, 129, 0.3);

        --shadow-card: 0 20px 30px -10px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
        --shadow-btn: 0 4px 14px rgba(59, 130, 246, 0.35);
      }
    }

    /* ==========================================================================
       2. Reset & Layout พื้นฐาน (Responsive & 8pt Grid)
       ========================================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* การ์ดฟอร์ม Login (Card Container) */
    .login-container {
      width: 100%;
      max-width: 400px;
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
      padding: 36px 32px;
      transition: all 0.3s ease;
    }

    /* ==========================================================================
       3. ส่วนหัว (Logo & Header)
       ========================================================================== */
    .login-header {
      text-align: center;
      margin-bottom: 26px;
    }

    .logo-badge {
      width: 52px;
      height: 52px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), #1D4ED8);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-btn);
    }

    .logo-badge svg {
      width: 28px;
      height: 28px;
    }

    .system-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-title);
      letter-spacing: -0.01em;
    }

    .system-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* ==========================================================================
       4. การแจ้งเตือนส่วนกลาง (Global Alert Banner)
       ========================================================================== */
    .alert-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      animation: fadeIn 0.2s ease-out;
    }

    .alert-banner.error {
      display: flex;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: var(--danger);
    }

    .alert-banner.success {
      display: flex;
      background-color: var(--success-bg);
      border: 1px solid var(--success-border);
      color: var(--success);
    }

    .alert-banner svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       5. ฟอร์มและช่องกรอกข้อมูล (Form Fields & Inputs)
       ========================================================================== */
    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-title);
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      width: 18px;
      height: 18px;
      color: var(--text-placeholder);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    .form-input {
      width: 100%;
      height: 46px; /* Touch target >= 44px */
      background-color: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 0 44px 0 42px;
      font-size: 14px;
      font-family: inherit;
      color: var(--text-title);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .form-input::placeholder {
      color: var(--text-placeholder);
    }

    .form-input:hover {
      border-color: var(--border-strong);
    }

    .form-input:focus {
      background-color: var(--bg-input-focus);
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--primary-focus-ring);
    }

    .form-input:focus ~ .input-icon-left {
      color: var(--primary);
    }

    /* สไตล์เมื่อกรอกข้อมูลผิด (Error State) */
    .form-group.has-error .form-input {
      border-color: var(--danger) !important;
      background-color: var(--danger-bg);
    }

    .form-group.has-error .form-input:focus {
      box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.25);
    }

    .form-group.has-error .input-icon-left {
      color: var(--danger);
    }

    /* ข้อความแจ้งเตือนความผิดพลาดใต้ช่อง (Field Error Message) */
    .field-error-msg {
      display: none;
      font-size: 12px;
      color: var(--danger);
      margin-top: 5px;
      align-items: center;
      gap: 4px;
    }

    .form-group.has-error .field-error-msg {
      display: flex;
    }

    /* ปุ่มแสดง/ซ่อนรหัสผ่าน (Password Visibility Toggle) */
    .btn-toggle-password {
      position: absolute;
      right: 4px;
      width: 38px;
      height: 38px;
      background: transparent;
      border: none;
      color: var(--text-placeholder);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 6px;
      transition: color 0.2s, background-color 0.2s;
    }

    .btn-toggle-password:hover {
      color: var(--text-title);
      background-color: rgba(0, 0, 0, 0.05);
    }

    .btn-toggle-password:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    /* ==========================================================================
       6. ตัวเลือกเสริม (Remember Me & Forgot Password)
       ========================================================================== */
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 6px;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .checkbox-container {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-body);
      cursor: pointer;
      user-select: none;
    }

    .checkbox-container input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      border-radius: 4px;
      cursor: pointer;
    }

    .forgot-link {
      color: var(--primary);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s, text-decoration 0.15s;
    }

    .forgot-link:hover {
      text-decoration: underline;
      color: var(--primary-hover);
    }

    .forgot-link:focus-visible {
      outline: 2px solid var(--border-focus);
      outline-offset: 2px;
    }

    /* ==========================================================================
       7. ปุ่มส่งข้อมูล (Submit Button & Loading State)
       ========================================================================== */
    .btn-submit {
      width: 100%;
      height: 48px;
      background-color: var(--primary);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--shadow-btn);
      transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    .btn-submit:active {
      transform: scale(0.98);
      background-color: var(--primary-active);
    }

    .btn-submit:focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 3px;
    }

    .btn-submit:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      pointer-events: none;
    }

    /* แอนิเมชัน Loading Spinner */
    .spinner {
      display: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #FFFFFF;
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
    }

    .btn-submit.loading .spinner {
      display: block;
    }

    .btn-submit.loading .btn-text {
      opacity: 0.9;
    }


    /* แอนิเมชัน */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* รองรับการย่อหน้าจอของมือถือขนาดเล็ก */
    @media (max-width: 480px) {
      .login-container {
        padding: 24px 20px;
      }
      .system-title {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>

  <main class="login-container" role="main">
    
    <!-- ส่วนหัว: โลโก้ และ ชื่อระบบ -->
    <header class="login-header">
      <div class="logo-badge" aria-hidden="true">
        <!-- ไอคอนโล่ความปลอดภัย (Security Shield) -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          <path d="M12 8v4"/>
          <path d="M12 16h.01"/>
        </svg>
      </div>
      <h1 class="system-title">Admin Panel</h1>
      <p class="system-subtitle">ระบบเฝ้าระวังการสอบ Smart AI Exam Integrity</p>
    </header>

    <!-- ป้ายแจ้งเตือนข้อผิดพลาดส่วนกลาง (Global Alert Banner) -->
    <div id="alertBanner" class="alert-banner" role="alert" aria-live="assertive">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <span id="alertMessage">อีเมลหรือรหัสผ่านไม่ถูกต้อง</span>
    </div>

    <!-- ฟอร์มเข้าสู่ระบบ (Login Form) -->
    <form id="adminLoginForm" novalidate onsubmit="handleSubmit(event)">
      
      <!-- 1. ช่องกรอกอีเมลหรือชื่อผู้ใช้ -->
      <div class="form-group" id="groupAccount">
        <label for="accountInput" class="form-label">อีเมลหรือชื่อผู้ใช้งาน</label>
        <div class="input-wrapper">
          <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
          <input 
            type="text" 
            id="accountInput" 
            class="form-input" 
            placeholder="admin@example.com หรือ admin"
            autocomplete="username"
            spellcheck="false"
            required
            aria-required="true"
            aria-describedby="accountError"
          />
        </div>
        <div id="accountError" class="field-error-msg" role="alert">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="accountErrorText">กรุณากรอกอีเมลหรือชื่อผู้ใช้งาน</span>
        </div>
      </div>

      <!-- 2. ช่องกรอกรหัสผ่าน -->
      <div class="form-group" id="groupPassword">
        <label for="passwordInput" class="form-label">รหัสผ่าน</label>
        <div class="input-wrapper">
          <svg class="input-icon-left" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
          <input 
            type="password" 
            id="passwordInput" 
            class="form-input" 
            placeholder="••••••••"
            autocomplete="current-password"
            required
            aria-required="true"
            aria-describedby="passwordError"
          />
          <!-- ปุ่มคลิกแสดง/ซ่อนรหัสผ่าน -->
          <button 
            type="button" 
            class="btn-toggle-password" 
            id="btnTogglePassword"
            onclick="togglePasswordVisibility()" 
            aria-label="แสดงรหัสผ่าน" 
            title="แสดงรหัสผ่าน"
          >
            <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
        <div id="passwordError" class="field-error-msg" role="alert">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="passwordErrorText">กรุณากรอกรหัสผ่าน</span>
        </div>
      </div>

      <!-- 3. แถว Checkbox จดจำฉัน และ ลิงก์ลืมรหัสผ่าน -->
      <div class="form-options">
        <label class="checkbox-container">
          <input type="checkbox" id="rememberMe" />
          <span>จดจำฉันไว้ในระบบ</span>
        </label>
        <a href="javascript:void(0)" class="forgot-link" onclick="handleForgotPassword()">ลืมรหัสผ่าน?</a>
      </div>

      <!-- 4. ปุ่มเข้าสู่ระบบ พร้อมสถานะ Loading -->
      <button type="submit" class="btn-submit" id="submitBtn">
        <div class="spinner" id="btnSpinner" aria-hidden="true"></div>
        <span class="btn-text" id="btnText">เข้าสู่ระบบ</span>
      </button>

      <div style="text-align:center;font-size:0.82rem;color:var(--text-muted, #64748b);margin-top:16px;">
        💡 ข้อมูลเข้าใช้งาน: บัญชี <b>admin</b> | รหัสผ่าน <b>admin123</b> หรือ <b>admin1234</b>
      </div>

    </form>

  </main>

  <!-- ==========================================================================
       JavaScript Logic: Validation, API Connection & Security Control
       ========================================================================== -->
  <script>
    // --------------------------------------------------------------------------
    // 1. ดึง DOM Elements ที่เกี่ยวข้อง
    // --------------------------------------------------------------------------
    const form = document.getElementById('adminLoginForm');
    const accountInput = document.getElementById('accountInput');
    const passwordInput = document.getElementById('passwordInput');
    const rememberMeCheckbox = document.getElementById('rememberMe');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const alertBanner = document.getElementById('alertBanner');
    const alertMessage = document.getElementById('alertMessage');
    const eyeIcon = document.getElementById('eyeIcon');
    const btnTogglePassword = document.getElementById('btnTogglePassword');

    const groupAccount = document.getElementById('groupAccount');
    const groupPassword = document.getElementById('groupPassword');
    const accountErrorText = document.getElementById('accountErrorText');
    const passwordErrorText = document.getElementById('passwordErrorText');

    // --------------------------------------------------------------------------
    // 2. โหลดข้อมูล "จดจำฉันไว้ในระบบ" จาก localStorage ตอนเปิดหน้าเว็บ
    // --------------------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      const savedAccount = localStorage.getItem('saved_admin_account');
      if (savedAccount) {
        accountInput.value = savedAccount;
        rememberMeCheckbox.checked = true;
      } else {
        accountInput.value = 'admin';
      }
      passwordInput.focus();
    });

    // --------------------------------------------------------------------------
    // 3. ฟังก์ชันสลับแสดง/ซ่อนรหัสผ่าน (Toggle Password Visibility)
    // --------------------------------------------------------------------------
    function togglePasswordVisibility() {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';

      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
        btnTogglePassword.setAttribute('aria-label', 'ซ่อนรหัสผ่าน');
        btnTogglePassword.setAttribute('title', 'ซ่อนรหัสผ่าน');
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
        btnTogglePassword.setAttribute('aria-label', 'แสดงรหัสผ่าน');
        btnTogglePassword.setAttribute('title', 'แสดงรหัสผ่าน');
      }
    }

    // --------------------------------------------------------------------------
    // 4. การตรวจสอบความถูกต้องของข้อมูล (Validation Logic)
    // --------------------------------------------------------------------------
    function validateForm() {
      let isValid = true;
      const accountValue = accountInput.value.trim();
      const passwordValue = passwordInput.value;

      if (!accountValue) {
        showFieldError(groupAccount, accountErrorText, 'กรุณากรอกอีเมลหรือชื่อผู้ใช้งาน');
        isValid = false;
      } else if (accountValue.includes('@')) {
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailRegex.test(accountValue)) {
          showFieldError(groupAccount, accountErrorText, 'รูปแบบอีเมลไม่ถูกต้อง');
          isValid = false;
        } else {
          clearFieldError(groupAccount);
        }
      } else {
        clearFieldError(groupAccount);
      }

      if (!passwordValue) {
        showFieldError(groupPassword, passwordErrorText, 'กรุณากรอกรหัสผ่าน');
        isValid = false;
      } else {
        clearFieldError(groupPassword);
      }

      return isValid;
    }

    function showFieldError(groupEl, errorTextEl, message) {
      groupEl.classList.add('has-error');
      errorTextEl.textContent = message;
      errorTextEl.classList.add('visible');
    }

    function clearFieldError(groupEl) {
      groupEl.classList.remove('has-error');
      const errEl = groupEl.querySelector('.field-error');
      if (errEl) {
        errEl.textContent = '';
        errEl.classList.remove('visible');
      }
    }

    function showAlert(type, message) {
      alertBanner.className = `alert-banner ${type} visible`;
      alertMessage.textContent = message;
    }

    function hideAlertBanner() {
      alertBanner.className = 'alert-banner';
      alertMessage.textContent = '';
    }

    // --------------------------------------------------------------------------
    // 6. เชื่อมต่อ Backend API & จำลองการตรวจสอบ (API Integration)
    // --------------------------------------------------------------------------
    async function loginAPI(credentials) {
      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: JSON.stringify({
            account: credentials.account,
            password: credentials.password,
            remember: credentials.remember
          })
        });

        if (response.ok) {
          return await response.json();
        } else if (response.status === 401) {
          const errData = await response.json().catch(() => ({}));
          throw new Error(errData.message || 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
        }
      } catch (e) {
        if (e.message && e.message.includes('อีเมลหรือรหัสผ่าน')) {
          throw e;
        }
        console.warn('API connection fallback to mock:', e);
      }

      await new Promise(resolve => setTimeout(resolve, 300));

      const validAccounts = ['admin', 'admin@example.com', 'admin@gmail.com', 'tuna'];
      const validPasswords = ['admin123', 'admin1234', 'Tuna1234', 'admin'];

      const accMatch = validAccounts.includes(credentials.account.toLowerCase());
      const passMatch = validPasswords.includes(credentials.password);

      if (accMatch && passMatch) {
        return {
          success: true,
          token: 'jwt-token-exam-cctv-admin-' + Date.now(),
          user: { name: 'Super Admin', role: 'administrator' }
        };
      } else {
        throw new Error('อีเมลหรือรหัสผ่านไม่ถูกต้อง (ลอง admin / admin123 หรือ admin1234)');
      }
    }

    // --------------------------------------------------------------------------
    // 7. จัดการการ Submit ฟอร์ม (Form Submission Handler)
    // --------------------------------------------------------------------------
    async function handleSubmit(event) {
      event.preventDefault();
      hideAlertBanner();

      if (!validateForm()) {
        return;
      }

      setLoading(true);

      const credentials = {
        account: accountInput.value.trim(),
        password: passwordInput.value,
        remember: rememberMeCheckbox.checked
      };

      try {
        const result = await loginAPI(credentials);

        if (credentials.remember) {
          localStorage.setItem('saved_admin_account', credentials.account);
        } else {
          localStorage.removeItem('saved_admin_account');
        }

        const token = result.token || ('token_' + Date.now());
        const userData = JSON.stringify(result.user || { name: 'Super Admin', role: 'administrator', account: credentials.account });

        if (credentials.remember) {
          localStorage.setItem('saved_admin_account', credentials.account);
          localStorage.setItem('admin_token', token);
          localStorage.setItem('admin_user', userData);
          localStorage.setItem('cctv_admin_logged_in', 'true');
        } else {
          localStorage.removeItem('saved_admin_account');
          localStorage.removeItem('admin_token');
          localStorage.removeItem('admin_user');
        }

        sessionStorage.setItem('admin_token', token);
        sessionStorage.setItem('admin_user', userData);
        sessionStorage.setItem('cctv_admin_token', token);
        localStorage.setItem('cctv_admin_logged_in', 'true');

        showAlert('success', 'เข้าสู่ระบบสำเร็จ! กำลังนำท่านเข้าสู่หน้าหลักแดชบอร์ด...');
        
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 400);

      } catch (error) {
        showAlert('error', error.message || 'เข้าสู่ระบบไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
        passwordInput.value = '';
        passwordInput.focus();
        setLoading(false);
      }
    }

    function setLoading(isLoading) {
      if (isLoading) {
        submitBtn.disabled = true;
        submitBtn.classList.add('loading');
        btnText.textContent = 'กำลังเข้าสู่ระบบ...';
      } else {
        submitBtn.disabled = false;
        submitBtn.classList.remove('loading');
        btnText.textContent = 'เข้าสู่ระบบ';
      }
    }

    function handleForgotPassword() {
      alert('ระบบกู้คืนรหัสผ่าน: กรุณาติดต่อหัวหน้าฝ่ายไอที หรืออาจารย์ผู้ดูแลเซิร์ฟเวอร์แม่ข่าย');
    }
  </script>
